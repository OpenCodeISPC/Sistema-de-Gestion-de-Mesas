[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts =
    -ra
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure
    --output=artifacts
    --html=reports/reporte.html
    --self-contained-html
markers =
    e2e: Flujos criticos end-to-end de negocio (Playwright + POM)
