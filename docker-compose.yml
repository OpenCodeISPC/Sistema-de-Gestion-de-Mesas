services:
  postgres_nuevo_proyecto:
    image: postgres:16
    container_name: sgmb_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - datos_postgres_sgmb:/var/lib/postgresql/data

  mongo_nuevo_proyecto:
    image: mongo:7
    container_name: sgmb_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27018:27017"
    volumes:
      - datos_mongo_sgmb:/data/db

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sgmb_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_nuevo_proyecto

  mongo_express:
    image: mongo-express:latest
    container_name: sgmb_mongo_express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo_nuevo_proyecto
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    depends_on:
      - mongo_nuevo_proyecto

volumes:
  datos_postgres_sgmb:
  datos_mongo_sgmb: