<section class="sgmb-auth">
  <main class="sgmb-auth__content container py-5">
    <div class="sgmb-auth__form card shadow-sm p-4 mx-auto">
      <h1>Iniciar Sesión</h1>

      <div class="sgmb-auth__field mb-3">
        <label for="username"> Ingrese su nombre de usuario </label>

        <input id="username" type="text" placeholder="Ejemplo: Lucia07"  class="form-control">
      </div>

      <div class="sgmb-auth__field mb-3">
        <label for="password"> Ingrese su contraseña </label>

        <input id="password" type="password" placeholder="Ejemplo: Casa12"  class="form-control">
      </div>

      <div class="sgmb-auth__roles">
        <label> Seleccione su rol de acceso: </label>

        <div class="sgmb-role-grid">
          <button type="button">Cocina</button>

          <button type="button">Mozo</button>

          <button type="button">Barra</button>

          <button type="button" class="sgmb-role-grid__item--active">
            Administrador
          </button>
        </div>
      </div>

      <button type="button" class="sgmb-auth__submit btn btn-primary w-100">Iniciar sesión</button>

      <p class="sgmb-auth__footer">
        ¿No tenes una cuenta<i class="bi bi-question-circle" aria-hidden="true"></i>
        <a routerLink="/registro">Registrate</a>
      </p>

      <p class="sgmb-auth__forgot">
        <a routerLink="/recupero-password"> ¿Olvidaste tu contraseña<i class="bi bi-question-circle" aria-hidden="true"></i> </a>
      </p>
    </div>
  </main>
</section>
