<section class="sgmb-auth">
  <main class="sgmb-auth__content container py-5">
    <div class="sgmb-auth__form sgmb-auth__form--forgot card shadow-sm p-4 mx-auto" style="max-width: 450px;">
      
      <!-- Mensajes de feedback -->
      <div *ngIf="mensajeExito" class="alert alert-success" role="alert">
        {{ mensajeExito }}
      </div>
      <div *ngIf="mensajeError" class="alert alert-danger" role="alert">
        {{ mensajeError }}
      </div>

      <!-- VISTA A: Solicitar correo (Si NO hay token en la URL) -->
      <div *ngIf="!isTokenMode">
        <h1>Recuperar contraseña</h1>
        <p class="sgmb-auth__description text-muted">
          Ingrese su correo electrónico y le enviaremos las instrucciones para recuperar su contraseña.
        </p>

        <form [formGroup]="emailForm" (ngSubmit)="solicitar()">
          <div class="sgmb-auth__field mb-3">
            <label for="recovery-email" class="form-label text-muted">Ingrese su correo electrónico</label>
            <input 
              id="recovery-email" 
              type="email" 
              formControlName="email"
              placeholder="Ej: juan_lopez@gmail.com" 
              class="form-control"
            >
          </div>

          <button type="submit" [disabled]="emailForm.invalid" class="sgmb-auth__submit btn btn-primary w-100">
            Recuperar contraseña
          </button>
        </form>
      </div>

      <!-- VISTA B: Restablecer contraseña (Si SÍ hay token y uid en la URL) -->
      <div *ngIf="isTokenMode">
        <h1>Nueva contraseña</h1>
        <p class="sgmb-auth__description text-muted">
          Ingrese su nueva contraseña para finalizar el proceso.
        </p>

        <form [formGroup]="confirmForm" (ngSubmit)="restablecer()">
          <div class="sgmb-auth__field mb-3">
            <label for="new-password" class="form-label text-muted">Nueva contraseña</label>
            <input 
              id="new-password" 
              type="password" 
              formControlName="new_password"
              placeholder="Mínimo 8 caracteres" 
              class="form-control"
            >
          </div>

          <button type="submit" [disabled]="confirmForm.invalid" class="sgmb-auth__submit btn btn-success w-100">
            Restablecer contraseña
          </button>
        </form>
      </div>

      <p class="sgmb-auth__footer mt-3 text-center">
        ¿Recordaste tu contraseña? 
        <a routerLink="/login">Iniciar sesión</a>  
      </p>

    </div>
  </main>
</section>
