<section class="sgmb-auth">
  <main class="sgmb-auth__content container py-5">
    <div class="sgmb-auth__form sgmb-auth__form--forgot card shadow-sm p-4 mx-auto">
      <h1>Recuperar contraseña</h1>

      <p class="sgmb-auth__description">
        Ingrese su correo electrónico y le enviaremos las instrucciones para
        recuperar su contraseña.
      </p>


      <div class="sgmb-auth__field mb-3">
        <label for="recovery-email"> Ingrese su correo electrónico </label>

        <input id="recovery-email" type="email" placeholder="Ej: juan_lopez@gmail.com" class="form-control">
      </div>

      <button type="button" class="sgmb-auth__submit btn btn-primary w-100">
        Recuperar contraseña
      </button>

      <p class="sgmb-auth__footer">
        ¿Recordaste tu contraseña<i class="bi bi-question-circle" aria-hidden="true"></i>
        <a href="#">Iniciar sesión</a>
      </p>
    </div>
  </main>
</section>
