<section class="sgmb-auth">
  <main class="sgmb-auth__content container py-5">
    <div
      class="sgmb-auth__form sgmb-auth__form--register card shadow-sm p-4 mx-auto"
    >
      <h1>Crear Cuenta</h1>

      <div class="sgmb-auth__password-grid mb-3">
        <div class="sgmb-auth__field mb-3">
          <label for="name" class="text-muted"> Ingrese su nombre</label>

          <input
            id="name"
            type="text"
            placeholder="Ej: Juan"
            class="form-control"
          />
        </div>
        <div class="sgmb-auth__field mb-3">
        <label for="lastname" class="text-muted"> Ingrese su apellido</label>

        <input
          id="lastname"
          type="text"
          placeholder="Ej: Lopez"
          class="form-control"
        />
      </div>
 </div>

      <div class="sgmb-auth__field mb-3">
        <label for="email" class="text-muted"> Ingrese su gmail </label>

        <input
          id="email"
          type="email"
          placeholder="Ej: juan_lopez@gmail.com"
          class="form-control"
        />
      </div>

      <div class="sgmb-auth__password-grid">
        <div class="sgmb-auth__field mb-3">
          <label for="register-password" class="text-muted">
            Ingrese su contraseña
          </label>

          <input
            id="register-password"
            type="password"
            placeholder="Ej: ingrese la contraseña"
            class="form-control"
          />
        </div>

        <div class="sgmb-auth__field mb-3">
          <label for="confirm-password" class="text-muted">
            Confirme su contraseña
          </label>

          <input
            id="confirm-password"
            type="password"
            placeholder="repita la contraseña"
            class="form-control"
          />
        </div>
      </div>

      <div class="sgmb-auth__roles">
        <label class="text-muted"> Seleccione su rol de acceso: </label>

        <div class="sgmb-role-grid">
          <button type="button">COCINA</button>

          <button type="button">MOZO</button>

          <button type="button">CAJERO</button>

          <button type="button" class="sgmb-role-grid__item--active">
            ADMIN
          </button>
        </div>
      </div>

      <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-4">
      <button type="button" class="btn btn-outline-danger h-auto" >
        <i class="bi bi-google" aria-hidden="true"></i>
        Iniciar con Google
      </button>

      <button type="button" class="sgmb-auth__submit btn w-auto px-3">
        Iniciar sesión
      </button>
    </div>

      <p class="sgmb-auth__footer">
        ¿Ya tenés una cuenta<i
          class="bi bi-question-circle"
          aria-hidden="true"
        ></i>
        <a href="">Iniciar sesión</a>
      </p>
    </div>
  </main>
</section>
